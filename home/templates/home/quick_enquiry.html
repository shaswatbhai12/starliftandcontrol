{% load static %}
<div class="text-white relative flex flex-col md:flex-row min-h-[500px]">
    
    <button onclick="closeModal()" type="button" class="absolute top-4 right-4 text-white hover:text-gray-200 text-4xl font-light z-20 transition-transform hover:scale-110">&times;</button>

    <div class="hidden md:flex md:w-2/5 bg-red-700 items-center justify-center p-8 border-r border-red-500/30">
        <div class="text-center">
            <img src="{% static 'enquiry-1.png' %}" alt="Star Engineering Support" class="w-full h-auto object-contain max-w-[250px]">
            <h3 class="mt-6 text-xl font-bold uppercase tracking-widest">Star Lift & Controller</h3>
            <p class="text-red-100 text-xs mt-2 leading-relaxed">Expert solutions for all your elevator needs. Get a quote today!</p>
        </div>
    </div>

    <div class="w-full md:w-3/5 p-8 md:p-12 flex flex-col justify-center">
        <h2 class="text-4xl font-black uppercase mb-6 leading-none tracking-tight">Get a Quote</h2>
        
    <form method="POST" action="{% url 'quick_enquiry' %}" class="space-y-4">            {% csrf_token %}
            
            <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                <div class="flex flex-col">
                    <label class="text-[10px] font-bold uppercase mb-1 tracking-widest text-red-100">Full Name *</label>
                    <input type="text" name="name" id="id_name" class="p-3 rounded-lg bg-white text-gray-900 outline-none focus:ring-4 focus:ring-red-400/50 transition-all shadow-inner" placeholder="Your Name" required>
                </div>
                <div class="flex flex-col">
                    <label class="text-[10px] font-bold uppercase mb-1 tracking-widest text-red-100">Phone No. *</label>
                    <input type="tel" name="phone" id="id_phone" class="p-3 rounded-lg bg-white text-gray-900 outline-none focus:ring-4 focus:ring-red-400/50 transition-all shadow-inner" placeholder="+91..." required>
                </div>
            </div>

            <div class="flex flex-col">
                <label class="text-[10px] font-bold uppercase mb-1 tracking-widest text-red-100">Email Address</label>
                <input type="email" name="email" id="id_email" class="p-3 rounded-lg bg-white text-gray-900 outline-none focus:ring-4 focus:ring-red-400/50 transition-all shadow-inner" placeholder="example@mail.com">
            </div>

            <div class="flex flex-col">
                <label class="text-[10px] font-bold uppercase mb-1 tracking-widest text-red-100">Description *</label>
                <textarea name="query" id="id_query" rows="3" class="p-3 rounded-lg bg-white text-gray-900 outline-none focus:ring-4 focus:ring-red-400/50 transition-all shadow-inner resize-none" placeholder="Briefly describe your queries..." required></textarea>
            </div>

            <button type="submit" class="w-full bg-gray-900 text-white font-bold py-4 rounded-xl hover:bg-black transition-all shadow-2xl uppercase tracking-widest text-sm active:scale-95 border border-transparent hover:border-white/20 mt-2">
                Submit 
            </button>
        </form>
    </div>
</div>
