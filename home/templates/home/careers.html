{% extends "home/basic.html" %}

{% block title %}Careers{% endblock %}

{% block content %}
<div class="container mx-auto p-6">
    <h1 class="text-3xl font-bold text-center mb-6">Join Our Team</h1>

    <div class="grid md:grid-cols-2 lg:grid-cols-3 gap-6">
        {% for job in jobs %}
            <div class="bg-white p-4 shadow-md rounded-lg">
                <h2 class="text-xl font-semibold">{{ job.title }}</h2>
                <p class="text-gray-600">{{ job.location }}</p>
                <p class="mt-2">{{ job.description|truncatewords:20 }}</p>
                <a href="{% url 'apply_for_job' job.id %}" class="block mt-3 bg-blue-600 text-white text-center p-2 rounded">
                    Apply Now
                </a>
            </div>
        {% empty %}
            <p class="text-gray-500">No job openings available.</p>
        {% endfor %}
    </div>
</div>
{% endblock %}
